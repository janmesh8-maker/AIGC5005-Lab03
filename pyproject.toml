[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recordsummary"
version = "0.1.0"
description = "Python package for summarizing records"
requires-python = ">=3.11"
dependencies = [
    "requests"
]

[tool.setuptools.packages.find]
where = ["src"]